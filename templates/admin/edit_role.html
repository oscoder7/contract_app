{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">Edit Role: {{ role.name }}</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Role Name</label>
                        <input type="text" name="name" class="form-control" value="{{ role.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text" name="description" class="form-control" value="{{ role.description or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Accessible Templates</label>
                        {% for t in templates %}
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="templates" value="{{ t.id }}" id="tmpl_{{ t.id }}"
                            {% if t in role.templates %}checked{% endif %}>
                            <label class="form-check-label" for="tmpl_{{ t.id }}">
                                {{ t.template_name }} (v{{ t.version_number }})
                                {% if t.is_active %}
                                <span class="badge bg-success">Active</span>
                                {% endif %}
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                    <button type="submit" class="btn btn-success">Save Changes</button>
                    <a href="{{ url_for('admin_roles') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
