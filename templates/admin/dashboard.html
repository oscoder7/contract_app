{% extends 'base.html' %}
{% block content %}
<h2>Admin Dashboard</h2>
<hr>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card text-center shadow">
            <div class="card-body">
                <h5 class="card-title">User Management</h5>
                <p class="card-text">Create, edit users and LDAP SSO.</p>
                <a href="{{ url_for('admin_users') }}" class="btn btn-primary">Manage Users</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center shadow">
            <div class="card-body">
                <h5 class="card-title">Role Permissions</h5>
                <p class="card-text">Assign template permissions to roles.</p>
                <a href="{{ url_for('admin_roles') }}" class="btn btn-primary">Manage Roles</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center shadow">
            <div class="card-body">
                <h5 class="card-title">Contract Templates</h5>
                <p class="card-text">Upload, duplicate, and test Jinja mapping.</p>
                <a href="{{ url_for('admin_templates') }}" class="btn btn-primary">Manage Templates</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
