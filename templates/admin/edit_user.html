{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">Edit User: {{ user.username }}</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password (leave blank to keep existing)</label>
                        <input type="password" name="password" class="form-control">
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="is_ldap" id="is_ldap" {% if user.is_ldap_user %}checked{% endif %}>
                        <label class="form-check-label" for="is_ldap">Enable LDAP SSO</label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">LDAP DN</label>
                        <input type="text" name="ldap_dn" class="form-control" value="{{ user.ldap_dn or '' }}">
                    </div>
                    <!-- Admin Privilege Checkbox -->
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="is_admin" id="is_admin" {% if user.is_admin %}checked{% endif %}>
                        <label class="form-check-label fw-bold text-danger" for="is_admin">Grant Administrator Access</label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Assigned Roles</label>
                        {% for r in roles %}
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="roles" value="{{ r.id }}" id="role_{{ r.id }}"
                            {% if r in user.roles %}checked{% endif %}>
                            <label class="form-check-label" for="role_{{ r.id }}">{{ r.name }}</label>
                        </div>
                        {% endfor %}
                    </div>
                    <button type="submit" class="btn btn-success">Save Changes</button>
                    <a href="{{ url_for('admin_users') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
