{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white font-weight-bold text-center">System Login</div>
            <div class="card-body">
                
                <!-- Passwordless SSO Action Button -->
                <a href="{{ url_for('sso_login') }}" class="btn btn-outline-primary w-100 mb-3 d-flex align-items-center justify-content-center">
                    <svg class="me-2" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm3.5 7.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5z"/>
                    </svg>
                    Sign in with Corporate SSO
                </a>

                <div class="text-center my-2 text-muted"><small>— OR LOCAL LOGIN —</small></div>

                <!-- Standard Local Credential Form -->
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-secondary w-100">Sign In with Password</button>
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
